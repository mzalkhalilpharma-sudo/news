<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جريدة الأخبار الإلكترونية</title>
    
    <!-- استخدام Tailwind CSS للتنسيق -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- خطوط جوجل (خط القاهرة للواجهة، وخط أميري للنصوص الكلاسيكية) -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* التنسيقات العامة الأساسية */
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f4f1ea; /* لون ورق الجرائد القديم */
            color: #1a1a1a;
        }
        
        .newspaper-title {
            font-family: 'Amiri', serif;
            font-weight: 700;
        }
        
        .newspaper-text {
            font-family: 'Amiri', serif;
            font-size: 1.15rem;
            line-height: 1.8;
            text-align: justify;
        }

        .newspaper-border {
            border-bottom: 4px double #333;
            border-top: 4px double #333;
        }

        /* تنسيقات الطباعة بمقاس A5 */
        @media print {
            @page {
                size: A5;
                margin: 15mm;
            }
            body {
                background-color: white !important;
            }
            /* إخفاء كل شيء باستثناء حاوية الطباعة */
            body.print-mode > *:not(#print-container) {
                display: none !important;
            }
            #print-container {
                display: block !important;
            }
            .print-article-image {
                max-height: 250px;
                object-fit: cover;
                width: 100%;
                margin-bottom: 15px;
                filter: grayscale(100%); /* طباعة أبيض وأسود لتبدو كجريدة */
            }
            .print-article-title {
                font-size: 24pt;
                line-height: 1.2;
                margin-bottom: 10px;
            }
            .print-article-text {
                font-size: 12pt;
                line-height: 1.6;
            }
        }

        /* إخفاء حاوية الطباعة في الوضع العادي */
        #print-container {
            display: none;
        }
        
        /* Loading Spinner */
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- الترويسة الرئيسية -->
    <header class="container mx-auto px-4 py-8 text-center no-print">
        <h1 class="newspaper-title text-6xl md:text-7xl mb-4 text-black">الجريدة الإلكترونية</h1>
        <div class="newspaper-border py-2 flex justify-between items-center text-sm font-semibold">
            <span id="current-date"></span>
            <span>الإصدار الرقمي</span>
            <span>رئيس التحرير: النظام التلقائي</span>
        </div>
    </header>

    <!-- منطقة التحميل والخطأ -->
    <div id="status-message" class="container mx-auto px-4 py-10 text-center no-print">
        <div class="loader mb-4" id="loader"></div>
        <p class="text-xl" id="loading-text">جاري جلب الأخبار من Google Sheets...</p>
    </div>

    <!-- حاوية التبويبات (الأبواب) -->
    <nav class="container mx-auto px-4 mb-8 no-print hidden" id="tabs-container">
        <ul class="flex flex-wrap border-b border-gray-400 justify-center gap-2" id="tabs-list">
            <!-- سيتم إضافة التبويبات هنا برمجياً -->
        </ul>
    </nav>

    <!-- حاوية الأخبار -->
    <main class="container mx-auto px-4 pb-12 no-print hidden" id="news-container">
        <!-- سيتم إضافة الأخبار هنا برمجياً -->
    </main>

    <!-- حاوية الطباعة A5 (تظهر فقط عند الطباعة) -->
    <div id="print-container">
        <div class="text-center mb-6" style="border-bottom: 2px solid black; padding-bottom: 10px;">
            <h2 class="newspaper-title" style="font-size: 18pt;">الجريدة الإلكترونية</h2>
        </div>
        <div id="print-content">
            <!-- سيتم حقن تفاصيل الخبر المراد طباعته هنا -->
        </div>
    </div>

    <script>
        // رابط الـ ID الخاص بالشيت الذي أرفقته
        const SHEET_ID = '14wyHZfI6n1odGs88G8nCePwNHlddFJyNzRIFvqeeOjA';
        // استخدام Google Visualization API لجلب البيانات كـ JSON
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

        let allNews = [];
        let categories = new Set();

        // دالة لجلب البيانات
        async function fetchNewsData() {
            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error('فشل في الاتصال بالشيت');
                
                let text = await response.text();
                
                // إزالة الأجزاء غير الضرورية من الاستجابة لتحويلها لـ JSON صحيح
                const jsonData = JSON.parse(text.substring(47, text.length - 2));
                
                const rows = jsonData.table.rows;
                
                if (rows.length === 0) {
                    throw new Error('لا توجد بيانات في الشيت');
                }

                // نتخطى الصف الأول إذا كان يحتوي على العناوين، ولكن سنفترض أن كل الصفوف بيانات للحيطة
                // يمكن تعديلها بـ rows.slice(1) إذا كان الصف الأول دائمًا للعناوين
                
                // نفترض الترتيب: 0: الباب, 1: العنوان, 2: التفاصيل, 3: الصورة, 4: التاريخ
                rows.forEach((row, index) => {
                    // التحقق من أن الصف ليس فارغاً تماماً
                    if (!row.c[0] && !row.c[1]) return;
                    
                    // إذا كان الصف الأول يحتوي على كلمات مثل "العنوان" نتخطاه
                    if (index === 0 && row.c[1] && row.c[1].v.includes('عنوان')) return;

                    const category = row.c[0] ? row.c[0].v : 'أخبار عامة';
                    const title = row.c[1] ? row.c[1].v : 'بدون عنوان';
                    const content = row.c[2] ? row.c[2].v : '';
                    const image = row.c[3] ? row.c[3].v : null;
                    const date = row.c[4] ? row.c[4].v : '';

                    allNews.push({ id: index, category, title, content, image, date });
                    categories.add(category);
                });

                renderApp();

            } catch (error) {
                console.error(error);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('loading-text').innerHTML = `
                    <span class="text-red-600 font-bold">حدث خطأ أثناء جلب البيانات.</span><br>
                    يرجى التأكد من أن ملف Google Sheets متاح للمشاركة كـ "أي شخص لديه الرابط" (Anyone with the link can view).
                `;
            }
        }

        // دالة بناء واجهة المستخدم بعد جلب البيانات
        function renderApp() {
            document.getElementById('status-message').classList.add('hidden');
            document.getElementById('tabs-container').classList.remove('hidden');
            document.getElementById('news-container').classList.remove('hidden');

            renderTabs();
            // عرض أول قسم افتراضياً
            const firstCategory = Array.from(categories)[0];
            if (firstCategory) {
                renderNews(firstCategory);
            }
        }

        // دالة رسم التبويبات
        function renderTabs() {
            const tabsList = document.getElementById('tabs-list');
            tabsList.innerHTML = '';

            Array.from(categories).forEach((category, index) => {
                const li = document.createElement('li');
                li.className = 'mr-1';
                
                const a = document.createElement('a');
                a.className = `bg-white inline-block border-t border-l border-r border-gray-400 rounded-t py-2 px-6 text-gray-800 font-bold hover:bg-gray-200 cursor-pointer text-lg tab-link ${index === 0 ? 'bg-gray-200 border-b-0' : 'border-b'}`;
                a.innerText = category;
                a.onclick = (e) => {
                    // تحديث شكل التبويبات
                    document.querySelectorAll('.tab-link').forEach(tab => {
                        tab.classList.remove('bg-gray-200', 'border-b-0');
                        tab.classList.add('border-b');
                    });
                    e.target.classList.remove('border-b');
                    e.target.classList.add('bg-gray-200', 'border-b-0');
                    
                    // عرض الأخبار
                    renderNews(category);
                };
                
                li.appendChild(a);
                tabsList.appendChild(li);
            });
        }

        // دالة رسم الأخبار للقسم المحدد
        function renderNews(category) {
            const container = document.getElementById('news-container');
            container.innerHTML = '';
            
            const filteredNews = allNews.filter(news => news.category === category);
            
            // استخدام نظام Grid لتوزيع الأخبار كأعمدة الجريدة
            const grid = document.createElement('div');
            grid.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8';

            filteredNews.forEach(news => {
                const article = document.createElement('article');
                article.className = 'bg-white p-6 border border-gray-300 shadow-sm flex flex-col justify-between';
                
                let imageHtml = '';
                if (news.image && news.image.startsWith('http')) {
                    imageHtml = `<img src="${news.image}" alt="صورة الخبر" class="w-full h-48 object-cover mb-4 border border-gray-200 filter grayscale hover:grayscale-0 transition duration-300">`;
                }

                article.innerHTML = `
                    <div>
                        ${imageHtml}
                        <span class="text-xs text-gray-500 font-bold mb-2 block">${news.date}</span>
                        <h2 class="newspaper-title text-2xl mb-3 text-black">${news.title}</h2>
                        <p class="newspaper-text text-gray-700 mb-4 line-clamp-4">
                            ${news.content.replace(/\n/g, '<br>')}
                        </p>
                    </div>
                    <div class="mt-4 pt-4 border-t border-gray-200 flex justify-between items-center">
                        <button onclick="printArticle(${news.id})" class="text-sm bg-gray-800 text-white py-1 px-4 rounded hover:bg-black flex items-center gap-2 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                            </svg>
                            طباعة A5
                        </button>
                        <button onclick="showFullArticle(${news.id})" class="text-blue-700 font-bold text-sm hover:underline">اقرأ المزيد &larr;</button>
                    </div>
                `;
                grid.appendChild(article);
            });

            container.appendChild(grid);
        }

        // دالة لعرض تفاصيل الخبر بالكامل في نفس الصفحة (بشكل مبسط)
        function showFullArticle(id) {
            const news = allNews.find(n => n.id === id);
            if (!news) return;

            const container = document.getElementById('news-container');
            
            let imageHtml = '';
            if (news.image && news.image.startsWith('http')) {
                imageHtml = `<img src="${news.image}" alt="صورة الخبر" class="w-full max-w-2xl mx-auto h-auto object-cover mb-8 border border-gray-300 p-1">`;
            }

            container.innerHTML = `
                <div class="max-w-4xl mx-auto bg-white p-8 md:p-12 border border-gray-300 shadow-md">
                    <button onclick="renderNews('${news.category}')" class="mb-6 text-sm bg-gray-200 py-1 px-3 rounded hover:bg-gray-300 flex items-center gap-2">
                        &rarr; العودة للقسم
                    </button>
                    <span class="text-sm font-bold text-red-700 mb-2 block">${news.category} | ${news.date}</span>
                    <h1 class="newspaper-title text-4xl md:text-5xl mb-8 leading-tight">${news.title}</h1>
                    ${imageHtml}
                    <div class="newspaper-text text-xl">
                        ${news.content.replace(/\n/g, '<br><br>')}
                    </div>
                    <div class="mt-10 pt-6 border-t border-gray-300 text-center">
                         <button onclick="printArticle(${news.id})" class="text-lg bg-gray-800 text-white py-2 px-8 rounded hover:bg-black inline-flex items-center gap-2 transition">
                            طباعة هذا الخبر (A5)
                        </button>
                    </div>
                </div>
            `;
        }

        // دالة تهيئة وطباعة الخبر بمقاس A5
        function printArticle(id) {
            const news = allNews.find(n => n.id === id);
            if (!news) return;

            const printContent = document.getElementById('print-content');
            
            let imageHtml = '';
            if (news.image && news.image.startsWith('http')) {
                imageHtml = `<img src="${news.image}" class="print-article-image">`;
            }

            // بناء هيكل الطباعة
            printContent.innerHTML = `
                <div style="text-align: right; margin-bottom: 15px;">
                    <span style="background: black; color: white; padding: 2px 8px; font-weight: bold; font-family: 'Cairo', sans-serif;">${news.category}</span>
                    <span style="font-size: 10pt; color: #555; margin-right: 10px;">${news.date}</span>
                </div>
                <h1 class="newspaper-title print-article-title">${news.title}</h1>
                ${imageHtml}
                <div class="newspaper-text print-article-text">
                    ${news.content.replace(/\n/g, '<br><br>')}
                </div>
            `;

            // تفعيل وضع الطباعة
            document.body.classList.add('print-mode');
            
            // استدعاء نافذة الطباعة
            window.print();

            // إلغاء وضع الطباعة بعد انتهاء العملية
            setTimeout(() => {
                document.body.classList.remove('print-mode');
            }, 500);
        }

        // ضبط التاريخ الحالي في الترويسة
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('ar-EG', options);

        // بدء التنفيذ
        fetchNewsData();

    </script>
</body>
</html>
